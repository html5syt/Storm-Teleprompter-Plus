name: Release

on:
  push:
    branches:
      - "v2"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  APP_NAME: storm_teleprompter_plus

jobs:
  release_metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      release_body: ${{ steps.metadata.outputs.release_body }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      draft: ${{ steps.metadata.outputs.draft }}
      release_source: ${{ steps.metadata.outputs.release_source }}
      app_version: ${{ steps.metadata.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: metadata
        name: Parse commit metadata or tag
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MESSAGE="$(git log -1 --format=%B "$GITHUB_SHA")"
          export COMMIT_MESSAGE

          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          message = os.environ.get("COMMIT_MESSAGE", "")
          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          sha = os.environ.get("GITHUB_SHA", "HEAD")
          output_path = os.environ["GITHUB_OUTPUT"]

          title = message.splitlines()[0].strip() if message.splitlines() else ref_name
          semver_tag = re.compile(r"^v\d+\.\d+\.\d+$")
          release_meta = re.compile(
              r"\[release\s+ver=\"(v\d+\.\d+\.\d+)\"\s*,\s*pre=(true|false)\s*,\s*draft=(true|false)\]"
          )

          should_release = False
          tag_name = ""
          prerelease = "false"
          draft = "false"
          release_source = "none"
          release_title = title or ref_name
          manual_body = "\n".join(message.splitlines()[1:])

          if ref.startswith("refs/tags/"):
              if semver_tag.fullmatch(ref_name):
                  should_release = True
                  tag_name = ref_name
                  prerelease = "false"
                  draft = "true"
                  release_source = "tag"
                  release_title = ref_name
              else:
                  print(f"Skipping non-release tag: {ref_name}")
          else:
              match = release_meta.search(message)
              if match:
                  should_release = True
                  tag_name = match.group(1)
                  prerelease = match.group(2)
                  draft = match.group(3)
                  release_source = "commit"
                  release_title = title
              elif "[release" in message:
                  print(
                      "::error::Release metadata must match "
                      '[release ver="vx.x.x",pre=false,draft=false]'
                  )
                  sys.exit(1)

          manual_body = release_meta.sub("", manual_body).strip()

          previous_tag_result = subprocess.run(
              [
                  "git",
                  "describe",
                  "--tags",
                  "--match",
                  "v[0-9]*.[0-9]*.[0-9]*",
                  "--abbrev=0",
                  f"{sha}^",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          previous_tag = previous_tag_result.stdout.strip()
          revision_range = f"{previous_tag}..{sha}" if previous_tag else sha
          log_result = subprocess.run(
              [
                  "git",
                  "log",
                  revision_range,
                  "--format=%H%x1f%h%x1f%s%x1f%aN",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          commits = []
          contributors = []
          contributor_keys = set()
          for row in log_result.stdout.splitlines():
              parts = row.split("\x1f", 3)
              if len(parts) != 4:
                  continue
              full_sha, short_sha, subject, author = parts
              commit_url = f"{server_url}/{repository}/commit/{full_sha}"
              commits.append(
                  f"- [`{short_sha}`]({commit_url}) {subject} - {author}"
              )
              author_key = author.casefold()
              if author_key not in contributor_keys:
                  contributor_keys.add(author_key)
                  contributors.append(author)

          generated_sections = []
          if commits:
              generated_sections.append(
                  "## 提交记录\n\n" + "\n".join(commits)
              )
          if contributors:
              generated_sections.append(
                  "## 贡献者\n\n" + "\n".join(
                      f"- {contributor}" for contributor in contributors
                  )
              )

          release_body = "\n\n".join(
              part for part in [manual_body, *generated_sections] if part
          )

          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write(f"should_release={'true' if should_release else 'false'}\n")
              fh.write(f"tag_name={tag_name}\n")
              fh.write(f"prerelease={prerelease}\n")
              fh.write(f"draft={draft}\n")
              fh.write(f"release_source={release_source}\n")
              fh.write(f"app_version={tag_name}\n")
              fh.write("release_title<<__RELEASE_TITLE__\n")
              fh.write(f"{release_title}\n")
              fh.write("__RELEASE_TITLE__\n")
              fh.write("release_body<<__RELEASE_BODY__\n")
              fh.write(f"{release_body}\n")
              fh.write("__RELEASE_BODY__\n")

          print(f"should_release={should_release}")
          print(f"release_source={release_source}")
          print(f"tag_name={tag_name}")
          print(f"prerelease={prerelease}")
          print(f"draft={draft}")
          print(f"release_title={release_title}")
          print(f"previous_tag={previous_tag or 'none'}")
          print(f"commit_count={len(commits)}")
          print(f"contributor_count={len(contributors)}")
          print(f"release_body_length={len(release_body)}")
          PY

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed Android release builds."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > html5syt.jks
          if [ ! -s html5syt.jks ]; then
            echo "::error::Decoded Android keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          {
            echo "storeFile=../html5syt.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android release artifacts
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          BUILD_NAME="${VERSION#v}"
          flutter pub get
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          flutter build appbundle --release --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            abi="$(basename "$apk" -release.apk)"
            abi="${abi#app-}"
            cp "$apk" "artifacts/${APP_NAME}-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab artifacts/${APP_NAME}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

