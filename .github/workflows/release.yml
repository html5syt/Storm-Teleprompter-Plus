  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          tar -czf artifacts/${APP_NAME}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*

  windows:
    name: Windows
    runs-on: windows-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows
        shell: powershell
        run: |
          $version = '${{ needs.release_metadata.outputs.app_version }}'
          $buildName = $version.TrimStart('v')
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --build-name=$buildName --dart-define=APP_VERSION=$version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\${env:APP_NAME}-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*

  apple:
    name: macOS and iOS
    runs-on: macos-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS and unsigned iOS
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          BUILD_NAME="${VERSION#v}"
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          MACOS_APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$MACOS_APP" ]; then
            echo "No macOS .app bundle found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$MACOS_APP" artifacts/${APP_NAME}-macos.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app artifacts/${APP_NAME}-ios-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: needs.release_metadata.outputs.should_release == 'true'
    needs:
      - release_metadata
      - android
      # - web
      - linux
      - windows
      - apple
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.tag_name }}
          name: ${{ needs.release_metadata.outputs.release_title }}
          draft: ${{ needs.release_metadata.outputs.draft }}
          prerelease: ${{ needs.release_metadata.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.release_metadata.outputs.release_body }}
          generate_release_notes: true
          files: dist/*
