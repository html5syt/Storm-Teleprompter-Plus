name: debug

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  APP_NAME: storm_teleprompter_plus

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed Android debug builds."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > html5syt.jks
          {
            echo "storeFile=../html5syt.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android debug artifacts
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          flutter pub get
          flutter build apk --debug --split-per-abi --dart-define=APP_VERSION="$VERSION"
          flutter build appbundle --debug --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          for apk in build/app/outputs/flutter-apk/*-debug.apk; do
            abi="$(basename "$apk" -debug.apk)"
            abi="${abi#app-}"
            cp "$apk" "artifacts/${APP_NAME}-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/debug/app-debug.aab artifacts/${APP_NAME}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

