  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --debug --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          tar -czf artifacts/${APP_NAME}-linux-x64.tar.gz -C build/linux/x64/debug/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows
        shell: powershell
        run: |
          $version = $env:GITHUB_SHA.Substring(0, 8)
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --debug --dart-define=APP_VERSION=$version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build\windows\x64\runner\debug\* -DestinationPath artifacts\${env:APP_NAME}-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*

  apple:
    name: macOS and iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS and unsigned iOS
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --debug --dart-define=APP_VERSION="$VERSION"
          flutter build ios --debug --no-codesign --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          MACOS_APP="$(find build/macos/Build/Products/debug -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$MACOS_APP" ]; then
            echo "No macOS .app bundle found."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$MACOS_APP" artifacts/${APP_NAME}-macos.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app artifacts/${APP_NAME}-ios-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: artifacts/*
